<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文档导航 · 原生交互实验</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.9 system-ui;color:#304237;background:#fff}header{padding:13px 20px;border-bottom:1px solid #e0e7dd;display:flex;justify-content:space-between}header b{letter-spacing:1px}header span{color:#7e8d79;font-size:10px}.layout{display:grid;grid-template-columns:160px 1fr;min-height:420px}nav{background:#f3f6ef;padding:20px}summary{cursor:pointer;font-size:12px;font-weight:600}nav button{display:block;border:0;background:none;padding:9px 7px;text-align:left;width:100%;color:#63725c;cursor:pointer;border-radius:4px;font-size:12px}nav button[aria-current=page]{background:#e0ead6;color:#355329}main{padding:24px;min-width:0}article{max-width:62ch;margin:auto}h1{font-size:25px;line-height:1.4}h2{font-size:16px}p{font-size:13px}.outline{display:flex;gap:15px;flex-wrap:wrap;border-bottom:1px solid #e4e9df;padding-bottom:15px;font-size:11px}a{color:#456637}code{background:#edf1e7;padding:3px 6px}aside{font-size:11px;background:#f1f5eb;border-left:2px solid #9eb385;padding:12px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #456637;outline-offset:3px}@media(max-width:620px){.layout{grid-template-columns:1fr}nav{padding:12px 20px}nav button{display:inline-block;width:auto;margin-right:10px}main{padding:20px}header span{display:none}}</style><header><b>FIELDNOTES</b><span>原创教学复现 · 非原项目</span></header><div class="layout"><nav aria-label="文章导航"><details open><summary>开始探索</summary><button aria-current="page" data-index="0">认识内容结构</button><button data-index="1">组织导航层级</button><button data-index="2">调整阅读宽度</button></details></nav><main><article><div class="outline"><a href="#principle">设计原则</a><a href="#practice">尝试一下</a><a href="#boundary">适用边界</a></div><h1 id="title">认识内容结构</h1><p id="intro">先将内容分成读者能理解的主题，再决定页面和菜单。导航是内容结构的表现。</p><h2 id="principle">设计原则</h2><p id="principle-text">为每一层导航安排一种职责：全局选择内容区域，侧栏选择文章，页内目录选择章节。</p><h2 id="practice">尝试一下</h2><p>点击左侧不同文章，观察标题、说明和当前项一起变化；展开或收起菜单，看看信息密度如何改变。</p><aside>操作提示：使用 Tab 移动焦点，Enter 激活；窄屏下菜单会移到正文上方。</aside><h2 id="boundary">适用边界</h2><p>此演示只展示交互原则，没有真正的页面路由、搜索服务或文章构建流程。当前选择在刷新后重置。</p></article></main></div><script>// 内容数据和界面逻辑分开，避免每篇文章复制一套事件。
const articles=[
 {title:'认识内容结构',intro:'先将内容分成读者能理解的主题，再决定页面和菜单。导航是内容结构的表现。',principle:'为每一层导航安排一种职责：全局选择内容区域，侧栏选择文章，页内目录选择章节。'},
 {title:'组织导航层级',intro:'分组名称应该帮助读者做选择，而不是暴露维护者的文件夹习惯。',principle:'把同一任务下的内容放在一起。当前项除了颜色，还要通过 aria-current 向辅助技术说明。'},
 {title:'调整阅读宽度',intro:'宽屏的剩余空间不必全部分给正文。控制行长，可以减少读者换行时寻找下一行的距离。',principle:'使用 max-width 约束正文，用媒体查询改变布局；不要仅仅把桌面三栏整体缩小。'}
];
const buttons=[...document.querySelectorAll('[data-index]')];
function selectArticle(index){
 document.querySelector('#title').textContent=articles[index].title;
 document.querySelector('#intro').textContent=articles[index].intro;
 document.querySelector('#principle-text').textContent=articles[index].principle;
 buttons.forEach((button,i)=>{if(i===index)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
}
buttons.forEach(button=>button.addEventListener('click',()=>selectArticle(Number(button.dataset.index))));
</script></html>
